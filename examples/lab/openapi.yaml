openapi: 3.1.0
info:
  title: Deliberately inaccurate widget lab
  version: '1.0'
servers:
  - url: http://127.0.0.1:8089
paths:
  /widgets:
    post:
      operationId: createWidget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
  /widgets/{widgetId}:
    parameters:
      - name: widgetId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getWidget
      responses:
        '200':
          description: Widget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
    patch:
      operationId: patchWidget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
    delete:
      operationId: deleteWidget
      responses:
        '204':
          description: Deleted
components:
  schemas:
    WidgetInput:
      type: object
      required: [name, mode, certificate]
      properties:
        name:
          type: string
          minLength: 1
          example: inspector-fixture
        mode:
          type: string
          enum: [simple, advanced]
        certificate:
          type: string
        certificatePassword:
          type: string
    Widget:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        mode:
          type: string
        certificate:
          type: string
