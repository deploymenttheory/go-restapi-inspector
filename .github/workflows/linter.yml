name: Cross-platform build
on:
  pull_request:
    paths: ['**/*.go', 'go.mod', 'go.sum', '.github/workflows/linter.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
          cache: true
      - run: go build ./...
        env:
          GOOS: '${{ matrix.goos }}'
          GOARCH: amd64
          CGO_ENABLED: '0'
